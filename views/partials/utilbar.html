<div class="utilbar">
  <div class="container utilbar-inner">
    <span class="util-msg">{{topbar.message}}</span>
    <nav class="util-links" aria-label="Links rápidos">{{{topLinks}}}</nav>
    <span class="fx" id="fx" title="{{fx.title}}" data-brl="{{fx.BRL}}" data-pyg="{{fx.PYG}}" data-at="{{fx.at}}" data-source="{{fx.source}}">
      <span class="fx-label">Cotação</span>
      <span class="cur" title="Dólar americano"><span class="flag flag-us" aria-hidden="true"></span>US$ 1 =</span>
      <span class="cur" title="Real brasileiro"><span class="flag flag-br" aria-hidden="true"></span><b id="fxBrl">{{fx.brlText}}</b></span>
      <span class="cur" title="Guarani paraguaio"><span class="flag flag-py" aria-hidden="true"></span><b id="fxPyg">{{fx.pygText}}</b></span>
    </span>
  </div>
</div>
