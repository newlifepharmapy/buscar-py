<div class="utilbar">
  <div class="container utilbar-inner">
    <span class="util-msg">{{topbar.message}}</span>
    <nav class="util-links" aria-label="Links rápidos">{{{topLinks}}}</nav>
    <span class="fx" id="fx" title="{{fx.title}}" data-brl="{{fx.BRL}}" data-pyg="{{fx.PYG}}" data-at="{{fx.at}}" data-source="{{fx.source}}">
      <span class="fx-label">Cotação:</span> US$ 1 = <b id="fxBrl">{{fx.brlText}}</b> · <b id="fxPyg">{{fx.pygText}}</b>
    </span>
  </div>
</div>
